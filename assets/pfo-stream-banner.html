<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PFO Stream Banner</title>
<meta name="viewport" content="width=1920, height=1080">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<!-- PFO animated stream banner. Streamlabs: Browser Source > Local File, 1920 x 1080. -->
<style>
  :root{--gold:#d4af37;--gold-hi:#f6e08f;--gold-deep:#9a7413;--silver:#c9ced6}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
  .stage{position:absolute;left:0;right:0;bottom:40px;display:flex;justify-content:center}
  .wrap{position:relative;animation:open 1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes open{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(-60px -20px -20px -20px)}}

  /* gold frame + solid panel */
  .frame{position:relative;padding:2px;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold-hi) 25%,var(--gold) 50%,var(--gold-hi) 75%,var(--gold-deep));
    background-size:200% 100%;animation:flow 6s linear infinite;
    clip-path:polygon(26px 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,26px 100%,0 50%)}
  @keyframes flow{to{background-position:-200% 0}}
  .banner{position:relative;overflow:hidden;display:flex;align-items:center;height:104px;
    padding:0 56px 0 48px;
    background:linear-gradient(180deg,#17171e 0%,#0e0e13 55%,#08080b 100%);
    clip-path:polygon(25px 0,calc(100% - 25px) 0,100% 50%,calc(100% - 25px) 100%,25px 100%,0 50%)}
  .banner::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,#141310 0 2px,transparent 2px 14px)}
  .banner::after{content:"";position:absolute;top:0;bottom:0;left:-240px;width:160px;
    background:linear-gradient(100deg,transparent,rgba(246,224,143,.18),transparent);
    transform:skewX(-20deg);animation:sweep 6s ease-in-out 1.4s infinite}
  @keyframes sweep{0%{left:-240px}45%,100%{left:110%}}

  /* logo badge sits on the left and rises slightly above the banner */
  .logo{position:relative;flex:0 0 auto;width:88px;height:88px;z-index:3;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.7));
    opacity:0;animation:pop .7s cubic-bezier(.2,.8,.2,1) .6s forwards}
  .logo img{width:100%;height:100%;object-fit:contain;display:block}
  @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}

  .item{position:relative;z-index:1;opacity:0;animation:slide .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes slide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}

  .title .main{font-family:"Bebas Neue",Impact,sans-serif;font-size:50px;letter-spacing:4px;line-height:1;white-space:nowrap;
    background:linear-gradient(90deg,var(--gold) 0%,var(--gold-hi) 45%,#fff6d0 50%,var(--gold-hi) 55%,var(--gold) 100%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 6s ease-in-out 1.6s infinite}
  @keyframes shine{0%{background-position:100% 0}45%,100%{background-position:-150% 0}}
  .title .sub{margin-top:6px;display:flex;align-items:center;gap:10px;
    font-family:Montserrat,sans-serif;font-weight:700;font-size:13px;letter-spacing:4px;color:var(--silver);white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;background:#e23b3b;animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,59,59,.6)}80%,100%{box-shadow:0 0 0 9px rgba(226,59,59,0)}}

  .divider{position:relative;z-index:1;width:2px;height:58px;margin:0 36px;flex:0 0 auto;
    background:linear-gradient(180deg,#0e0e13,var(--gold),#0e0e13)}

  .discord{display:flex;align-items:center;gap:14px}
  .discord svg{width:36px;height:36px;flex:0 0 auto}
  .discord .lbl{font-family:Montserrat,sans-serif;font-weight:700;font-size:12px;letter-spacing:4px;color:#a9aeb7;line-height:1;white-space:nowrap}
  .discord .url{margin-top:7px;font-family:Montserrat,sans-serif;font-weight:800;font-size:24px;line-height:1;color:#fff;white-space:nowrap}
  .discord .url b{color:var(--gold-hi);font-weight:800}

  .sparks{position:absolute;inset:-50px 0 0 0;pointer-events:none;z-index:4}
  .spark{position:absolute;bottom:20px;width:3px;height:3px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 6px var(--gold);opacity:0;animation:rise linear infinite}
  @keyframes rise{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),-80px)}}
</style>
</head>
